# NullVoidLabs site configuration
# Custom in-repo theme (layouts in _layouts/, styles in assets/css/, scripts in assets/js/).
# No remote theme: everything that renders the site lives in this repo.

title: NullVoidLabs
tagline: OT security lab notes and write-ups
description: >-
  Luis Rojas, working toward OT security engineering. Lab notes from an
  ESP32 Modbus testbench, plus attack-chain write-ups, malware analysis,
  and security assessments, documented end to end.

url: "https://www.nullvoidlabs.io"
baseurl: ""
lang: en
timezone: America/Los_Angeles

author:
  name: Luis Rojas
  url: https://www.nullvoidlabs.io/about/

# Used by jekyll-seo-tag and the footer / about page
twitter:
  username: nullvoidlabs
social:
  name: Luis Rojas
  links:
    - https://github.com/nullvoidlabs
    - https://www.linkedin.com/in/lrjsec
    - https://x.com/nullvoidlabs

# Footer / about contact links. Order here is display order.
contact:
  email: luisrjs@nullvoidlabs.io
  github: https://github.com/nullvoidlabs
  linkedin: https://www.linkedin.com/in/lrjsec
  x: https://x.com/nullvoidlabs

# Default social preview image (og:image)
image: /assets/img/social-card.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      # Keep this permalink: existing links to write-ups depend on it.
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Generated by _plugins/archives.rb (replaces jekyll-archives)
archives:
  tag_permalink: /tags/:name/
  category_permalink: /categories/:name/

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "package*.json"
  - node_modules
  - vendor
  - .bundle
  - .devcontainer
  - .vscode
  - Gemfile
  - Gemfile.lock
